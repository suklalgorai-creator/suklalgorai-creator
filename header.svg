<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1">
        <animate attributeName="stop-color" values="#0d1117;#1f173b;#0d1117" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#2a0f35;stop-opacity:1">
        <animate attributeName="stop-color" values="#2a0f35;#4d1a42;#2a0f35" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 55px;
        font-weight: 800;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="15" fill="url(#grad)" />
  <g transform="translate(400, 100)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1; 1.05; 1" dur="3s" repeatCount="indefinite"/>
      <text class="text" x="0" y="0">Hi, I'm Suklal ??</text>
    </g>
  </g>
</svg>
